# Construit et publie la version web sur GitHub Pages à chaque envoi sur « main ».
# Prérequis (voir docs/DEPLOIEMENT_GITHUB_PAGES.md) :
#   Settings > Pages > Source : « GitHub Actions »
#   Settings > Secrets and variables > Actions > Variables :
#     VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (clé publique « anon »)
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile=false
      - name: Tests unitaires (logique, contenu, paiements)
        run: pnpm test:core
      - name: Régénérer le contenu
        run: pnpm seed
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @coran/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
