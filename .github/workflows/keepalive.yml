# Offre gratuite Supabase : un projet inactif une semaine est mis en pause.
# Cette tâche gratuite fait une lecture simple tous les 3 jours pour le garder actif.
name: Maintien Supabase actif

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture du catalogue
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" || { echo "Variable VITE_SUPABASE_URL absente"; exit 0; }
          curl -fsS "$URL/rest/v1/modules?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase actif"
